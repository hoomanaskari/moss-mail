[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/hoomanaskari/moss-mail"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moss-core = { path = "crates/moss-core" }
moss-accounts = { path = "crates/moss-accounts" }
moss-store = { path = "crates/moss-store" }
moss-providers = { path = "crates/moss-providers" }
moss-engine = { path = "crates/moss-engine" }
moss-ai = { path = "crates/moss-ai" }
moss-extract = { path = "crates/moss-extract" }
moss-mcp = { path = "crates/moss-mcp" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
