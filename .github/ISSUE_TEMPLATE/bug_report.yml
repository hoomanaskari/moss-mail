name: Something isn't working
description: A bug, a crash, or mail that looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: The steps, one per line. A screenshot helps a lot.
      placeholder: |
        1. Open an email from…
        2. Press R
        3. …
  - type: dropdown
    id: account
    attributes:
      label: Which kind of account?
      multiple: true
      options:
        - Gmail
        - Outlook / Microsoft 365
        - iCloud
        - Yahoo
        - Fastmail
        - Other (IMAP)
        - Resend
        - Not about one account
  - type: input
    id: version
    attributes:
      label: Moss version
      description: At the bottom of Settings, for example "Moss 0.1.0".
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 26.1
  - type: markdown
    attributes:
      value: Please don't paste private emails, passwords or API keys. Cover them in screenshots.
