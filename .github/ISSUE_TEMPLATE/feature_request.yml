name: An idea
description: Something Moss should do, or do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's hard right now?
      description: Tell us what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Other apps that do it well are useful to mention.
