[package]
name = "moss-accounts"
description = "How Moss signs in to mail accounts and keeps their secrets in the OS keychain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
moss-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
keyring-core = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "charset", "system-proxy"] }
roxmltree = "0.21"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
