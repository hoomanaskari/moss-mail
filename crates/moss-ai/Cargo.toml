[package]
name = "moss-ai"
description = "Moss's on-device AI: reads the Mac, downloads the models, runs them with llama.cpp."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
moss-core.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
flate2 = "1"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "sync", "macros", "rt", "net"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

# A fake llama-server for the tests in tests/server.rs. Never shipped.
[[bin]]
name = "fake-llama-server"
path = "tests/fake/llama_server.rs"
test = false
doc = false
