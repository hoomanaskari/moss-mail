<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree%3Awght%40300..900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #161514">
    <div
      data-pencil-name="Alt · Inbox Zero"
      style="align-items: flex-start; background-color: #161514; box-sizing: border-box; display: flex; flex-direction: column; gap: 0px; height: 1024px; justify-content: flex-start; overflow: hidden; position: relative; width: 1440px"
    >
      <div
        data-pencil-name="Photo"
        style="align-items: flex-start; background-image: url('design-assets/generated.png'); background-position: center; background-repeat: no-repeat; background-size: cover; box-sizing: border-box; display: flex; flex-direction: row; gap: 0px; height: 1024px; justify-content: flex-start; left: 0px; position: absolute; top: 0px; width: 1440px; z-index: 0"
      ></div>
      <div
        data-pencil-name="Shade"
        style="align-items: flex-start; background-image: linear-gradient(180deg, #16151400 35%, #161514E6 100%); background-repeat: no-repeat; background-size: 100% 100%; box-sizing: border-box; display: flex; flex-direction: row; gap: 0px; height: 1024px; justify-content: flex-start; left: 0px; position: absolute; top: 0px; width: 1440px; z-index: 1"
      ></div>
      <div
        data-pencil-name="Top Bar"
        style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 16px; height: fit-content; justify-content: flex-start; padding: 18px 24px; position: relative; width: 100%; z-index: 2"
      >
        <div
          data-pencil-name="Window Controls"
          style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 8px; height: fit-content; justify-content: flex-start; width: fit-content"
        >
          <div
            data-pencil-name="Dot"
            style="background-color: #E8695E; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; height: 12px; width: 12px"
          ></div>
          <div
            data-pencil-name="Dot"
            style="background-color: #E9B949; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; height: 12px; width: 12px"
          ></div>
          <div
            data-pencil-name="Dot"
            style="background-color: #6CC055; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; height: 12px; width: 12px"
          ></div>
        </div>
      </div>
      <div
        data-pencil-name="Push"
        style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: row; flex: 1 1 0; gap: 0px; justify-content: flex-start; position: relative; width: 100%; z-index: 3"
      ></div>
      <div
        data-pencil-name="Content"
        style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 28px; height: fit-content; justify-content: flex-start; padding: 0px 120px 64px 120px; position: relative; width: 100%; z-index: 4"
      >
        <div
          data-pencil-name="Headline"
          style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 12px; height: fit-content; justify-content: flex-start; width: fit-content"
        >
          <div
            data-pencil-name="Title"
            style="box-sizing: border-box; color: #F4F0E8; font-family: Figtree, system-ui, sans-serif; font-size: 72px; font-style: normal; font-weight: 700; letter-spacing: -1.2px; line-height: normal; text-align: left; white-space: nowrap"
          >
            Inbox zero.
          </div>
          <div
            data-pencil-name="Sub"
            style="box-sizing: border-box; color: #E2DCD0; font-family: Figtree, system-ui, sans-serif; font-size: 22px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
          >
            You handled 8 emails in 14 minutes. That’s it for now.
          </div>
        </div>
        <div
          data-pencil-name="Stats"
          style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 48px; height: fit-content; justify-content: flex-start; padding: 8px 0px 0px 0px; width: fit-content"
        >
          <div
            data-pencil-name="handled"
            style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 2px; height: fit-content; justify-content: flex-start; width: fit-content"
          >
            <div
              data-pencil-name="Value"
              style="box-sizing: border-box; color: #F4F0E8; font-family: Figtree, system-ui, sans-serif; font-size: 32px; font-style: normal; font-weight: 700; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
            >
              8
            </div>
            <div
              data-pencil-name="Label"
              style="box-sizing: border-box; color: #B8B1A4; font-family: Figtree, system-ui, sans-serif; font-size: 15px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
            >
              handled
            </div>
          </div>
          <div
            data-pencil-name="coming back later"
            style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 2px; height: fit-content; justify-content: flex-start; width: fit-content"
          >
            <div
              data-pencil-name="Value"
              style="box-sizing: border-box; color: #F4F0E8; font-family: Figtree, system-ui, sans-serif; font-size: 32px; font-style: normal; font-weight: 700; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
            >
              3
            </div>
            <div
              data-pencil-name="Label"
              style="box-sizing: border-box; color: #B8B1A4; font-family: Figtree, system-ui, sans-serif; font-size: 15px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
            >
              coming back later
            </div>
          </div>
          <div
            data-pencil-name="waiting on you"
            style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 2px; height: fit-content; justify-content: flex-start; width: fit-content"
          >
            <div
              data-pencil-name="Value"
              style="box-sizing: border-box; color: #F4F0E8; font-family: Figtree, system-ui, sans-serif; font-size: 32px; font-style: normal; font-weight: 700; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
            >
              0
            </div>
            <div
              data-pencil-name="Label"
              style="box-sizing: border-box; color: #B8B1A4; font-family: Figtree, system-ui, sans-serif; font-size: 15px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
            >
              waiting on you
            </div>
          </div>
        </div>
        <div
          data-pencil-name="Bottom Row"
          style="align-items: flex-end; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: fit-content; justify-content: space-between; width: 100%"
        >
          <div
            data-pencil-name="Actions"
            style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 12px; height: fit-content; justify-content: flex-start; width: fit-content"
          >
            <div
              data-pencil-name="Close App"
              style="align-items: center; background-color: #F4F0E8; border-radius: 10px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 10px; height: fit-content; justify-content: flex-start; padding: 11px 16px; width: fit-content"
            >
              <div
                data-pencil-name="Label"
                style="box-sizing: border-box; color: #161514; font-family: Figtree, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 700; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
              >
                Close and take a break
              </div>
              <div
                data-pencil-name="Key"
                style="align-items: flex-start; background-color: #1615141A; border-radius: 5px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: fit-content; justify-content: flex-start; padding: 2px 7px; width: fit-content"
              >
                <div
                  data-pencil-name="K"
                  style="box-sizing: border-box; color: #161514; font-family: Figtree, system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
                >
                  ⌘W
                </div>
              </div>
            </div>
            <div
              data-pencil-name="Coming Back"
              style="align-items: center; background-color: #FFFFFF1A; border-radius: 10px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 10px; height: fit-content; justify-content: flex-start; outline-offset: -0.5px; outline: 1px solid #FFFFFF33; padding: 11px 16px; width: fit-content"
            >
              <div
                data-pencil-name="Label"
                style="box-sizing: border-box; color: #F4F0E8; font-family: Figtree, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
              >
                See what’s coming back
              </div>
            </div>
          </div>
          <div
            data-pencil-name="Next"
            style="align-items: flex-end; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 6px; height: fit-content; justify-content: flex-start; width: fit-content"
          >
            <div
              data-pencil-name="Check"
              style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 8px; height: fit-content; justify-content: flex-start; width: fit-content"
            >
              <div
                data-pencil-name="Label"
                style="box-sizing: border-box; color: #E2DCD0; font-family: Figtree, system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
              >
                Next check at 10:30. Quiet until 2:00 PM.
              </div>
            </div>
            <div
              data-pencil-name="Credit"
              style="box-sizing: border-box; color: #B8B1A4; font-family: Figtree, system-ui, sans-serif; font-size: 13px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: right; white-space: nowrap"
            >
              Morning lake · new image each day
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
